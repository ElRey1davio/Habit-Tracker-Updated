<!DOCTYPE html>
<html>
<head><title>Add Habit</title></head>
<body>
    <h1>Add a Habit</h1>
    <form method="POST" action="/submit-habit">
        <label>Habit:</label>
        <input type="text" name="habit"><br>
        <label>Frequency:</label>
        <input type="text" name="frequency"><br>
        <label>Streak:</label>
        <input type="number" name="streak"><br>
        <button type="submit">Add Habit</button>
    </form>
</body>
</html>
